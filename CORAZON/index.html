<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón Interactivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars"></div>

    <div class="player-container">
        <div class="player">
            <button id="play-btn">▶</button>
            <div class="player-info">
                <span class="player-title">Se que te gusta esta cancion Te la dedico💞</span>
                <span class="player-time">0:00 / 3:03</span>
            </div>
        </div>
        <audio id="background-music" src="cancion.mp3" loop></audio>
    </div>

    <div class="heart-container">
        <div class="heart" id="main-heart">❤️</div>
    </div>

    <div class="messages-container" id="messages-container"></div>

    <script src="script.js"></script>
</body>
</html>
